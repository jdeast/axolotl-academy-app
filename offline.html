<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axolotl Academy</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1b3a5c;
        color: #fff;
        font: 1.25rem/1.4 system-ui, sans-serif;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      .big {
        font-size: 5rem;
      }
      button {
        min-width: 120px;
        min-height: 72px;
        border: 0;
        border-radius: 999px;
        background: #ff8fb8;
        color: #1b3a5c;
        font-size: 2rem;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="big" aria-hidden="true">📶 🦎</div>
      <p>Axolotl Academy needs the internet once to get started.<br />Connect to Wi-Fi, then tap the button.</p>
      <button type="button" onclick="location.href = 'https://jdeast.github.io/axolotl-academy-app/'" aria-label="Try again">↻</button>
    </main>
  </body>
</html>
